<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دهبك — سعر الذهب ومدخراتك وزكاتك</title>
<meta name="description" content="تابع سعر الذهب لحظة بلحظة، سجّل مدخراتك من الذهب، واعرف الزكاة الواجبة عليها.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --card2:#faf8f3; --line:#e8e2d3;
    --gold:#a3821f; --gold-strong:#8f6b14; --gold-soft:#f5ead0;
    --btn-from:#dcb84e; --btn-to:#c39a2e;
    --ink:#221f18; --ink2:#7a7261; --green:#1a9e5c; --red:#d43a3a;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html.ar body{font-family:'Cairo','Manrope',sans-serif}
  html.en body{font-family:'Manrope','Cairo',sans-serif}
  body{background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:40px}
  .wrap{max-width:520px; margin:0 auto; padding:14px}

  /* top bar */
  header.top{display:flex; align-items:center; gap:12px; padding:14px 4px 10px}
  .coin{width:44px;height:44px;border-radius:14px;flex:none;
    background:linear-gradient(135deg,#e6c45c,#b78d24);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;
    box-shadow:0 4px 12px rgba(183,141,36,.35)}
  header.top .names{flex:1}
  header.top h1{font-size:21px;font-weight:800;line-height:1.2}
  header.top p{color:var(--ink2);font-size:12px;margin-top:1px}
  .lang-toggle{display:flex;background:#e9e3d3;border-radius:20px;padding:3px;flex:none}
  .lang-toggle button{border:none;background:transparent;color:var(--ink2);font-weight:700;font-size:12.5px;
    padding:6px 13px;border-radius:16px;cursor:pointer;font-family:inherit}
  .lang-toggle button.on{background:var(--ink);color:#fff}

  .card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; margin-top:14px;
    box-shadow:0 1px 3px rgba(34,31,24,.05)}
  .card h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
  .hint{color:var(--ink2);font-size:12.5px;line-height:1.75}

  /* price hero */
  .hero-head{display:flex;justify-content:space-between;align-items:center}
  .hero-price{display:flex;align-items:baseline;gap:8px;margin:10px 0 0;flex-wrap:wrap}
  .hero-price .num{font-size:42px;font-weight:800;letter-spacing:-1px;color:var(--ink)}
  .hero-price .unit{color:var(--ink2);font-size:13px}
  .chg{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:20px}
  .chg.up{color:var(--green);background:rgba(26,158,92,.1)}
  .chg.down{color:var(--red);background:rgba(212,58,58,.1)}
  .spark-wrap{margin-top:10px;display:none}
  .spark-cap{color:var(--ink2);font-size:11px;margin-bottom:2px}
  #spark{width:100%;height:52px;display:block}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .cell{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
  .cell .k{color:var(--ink2);font-size:11.5px;font-weight:700}
  .cell .v{font-size:16px;font-weight:800;color:var(--ink);margin-top:2px}
  .cell .v small{font-size:10.5px;color:var(--ink2);font-weight:600}
  .cell .buyline{font-size:11px;color:var(--ink2);font-weight:700;margin-top:2px}
  .hero-buy{color:var(--ink2);font-size:14px;font-weight:700;margin-top:6px}
  .priceline{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--ink2);font-size:11.5px;gap:8px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:800}
  .btn-gold{background:linear-gradient(135deg,var(--btn-from),var(--btn-to));color:#241b05;padding:10px 18px;font-size:13.5px;
    box-shadow:0 2px 8px rgba(195,154,46,.35)}
  .btn-ghost{flex:none;white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--ink2);padding:8px 14px;font-size:12.5px}
  .btn-gold:active,.btn-ghost:active{transform:scale(.97)}
  .errbox{display:none;background:#fdf1f1;border:1px solid #f0c9c9;border-radius:14px;padding:14px;margin-top:14px;font-size:13px;line-height:1.85;color:#7c2d2d}
  .errbox .why{color:#a86a6a;font-size:11px}
  .errbox button{margin-top:8px}
  .manual-link{display:inline-block;margin-top:12px;color:var(--gold);font-size:12.5px;text-decoration:underline;cursor:pointer;background:none;border:none;font-weight:700}
  .manual-row{gap:8px;margin-top:10px}
  .form-row.manual-row{display:none}
  .manual-row input{flex:1;min-width:0}

  /* forms */
  .form-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  select,input{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:14.5px;outline:none}
  select:focus,input:focus{border-color:var(--gold)}
  .form-row select{flex:1.1;min-width:110px}
  .form-row input{flex:1;min-width:90px}

  /* holdings */
  .add-form select,.add-form input{padding:14px 14px;font-size:16.5px;border-radius:14px}
  .add-form input::placeholder{font-size:14px}
  .add-form #fBuy,.add-form #fWk{flex:1 1 40%}
  .add-form .btn-gold{flex:1 1 100%;padding:15px;font-size:17px;border-radius:14px}
  .holding{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:16px 14px;margin-top:12px}
  .holding .info{flex:1}
  .holding .t{font-weight:800;font-size:17px}
  .holding .s{color:var(--ink2);font-size:13px;margin-top:2px}
  .holding .s2{color:var(--ink);font-size:13px;font-weight:700;margin-top:2px}
  .wknote{color:var(--ink2);font-size:12.5px;margin-top:12px;line-height:1.8;text-align:center}
  .holding .val{text-align:end}
  .holding .val .n{font-weight:800;font-size:18.5px}
  .holding .val .pl{font-size:14.5px;font-weight:800;margin-top:2px}
  .pl.up{color:var(--green)} .pl.down{color:var(--red)}
  .del{background:none;color:#b9b09a;font-size:19px;padding:8px 10px}
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .total{background:var(--gold-soft);border:1px solid #e5d5a8;border-radius:16px;padding:14px 8px;text-align:center}
  .total .k{color:var(--ink2);font-size:12px;font-weight:700}
  .total .v{font-size:18px;font-weight:800;color:var(--gold-strong);margin-top:4px}
  .total-hero{grid-column:1 / -1;background:linear-gradient(135deg,#f7ecc9,#efdb9d);border-color:#dfc47e;padding:18px 10px}
  .total-hero .k{font-size:13px}
  .total-hero .v{font-size:30px;letter-spacing:.3px}
  .total.up{background:#eef7f1;border-color:#bfe0cc}
  .total.down{background:#fdf1f1;border-color:#f0c9c9}
  .total.up .v{color:var(--green)}
  .total.down .v{color:var(--red)}
  .empty{color:var(--ink2);font-size:13px;text-align:center;padding:18px 8px 6px;line-height:1.85}

  /* zakat */
  .zakat-box{border-radius:14px;padding:14px;margin-top:12px;font-size:13.5px;line-height:1.9}
  .zakat-box.ok{background:#eef7f1;border:1px solid #c4e2d0}
  .zakat-box.no{background:var(--card2);border:1px solid var(--line)}
  .zakat-big{font-size:28px;font-weight:800;color:var(--gold-strong)}
  .prog{height:8px;background:#efe9da;border-radius:6px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--btn-to),var(--btn-from));border-radius:6px;transition:width .4s}

  footer{color:var(--ink2);font-size:11px;line-height:1.9;margin-top:20px;padding:0 6px}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800}
  .badge::before{content:'';width:7px;height:7px;border-radius:50%}
  .badge.live{color:var(--green)} .badge.live::before{background:var(--green);animation:pulse 1.6s infinite}
  .badge.stale{color:#b8860b} .badge.stale::before{background:#b8860b}
  .badge.err{color:var(--red)} .badge.err::before{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;
    padding:10px 20px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="coin">Au</div>
    <div class="names">
      <h1 id="tAppName">دهبك</h1>
      <p id="tTagline"></p>
    </div>
    <div class="lang-toggle" dir="ltr">
      <button id="langAr" onclick="setLang('ar')">عربي</button>
      <button id="langEn" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <!-- PRICES -->
  <section class="card">
    <div class="hero-head">
      <h2 id="tPriceNow"></h2>
      <span id="liveBadge" class="badge live"></span>
    </div>
    <div class="hero-price">
      <span class="num" id="g21">—</span>
      <span class="unit" id="tPerGram"></span>
      <span class="chg up" id="chg" style="display:none"></span>
    </div>
    <div class="hero-buy" id="heroBuy"></div>
    <div class="spark-wrap" id="sparkWrap">
      <div class="spark-cap" id="tSparkCap"></div>
      <svg id="spark" preserveAspectRatio="none" viewBox="0 0 300 52"></svg>
    </div>
    <div class="grid">
      <div class="cell"><div class="k" id="k24"></div><div class="v" id="g24">—</div></div>
      <div class="cell"><div class="k" id="k22"></div><div class="v" id="g22">—</div></div>
      <div class="cell"><div class="k" id="k21"></div><div class="v" id="g21b">—</div></div>
      <div class="cell"><div class="k" id="k18"></div><div class="v" id="g18">—</div></div>
      <div class="cell"><div class="k" id="kGineh"></div><div class="v" id="gineh">—</div></div>
      <div class="cell"><div class="k" id="kOz"></div><div class="v" id="oz">—</div></div>
    </div>
    <div class="errbox" id="errBox">
      <b id="tErrTitle"></b><br>
      <span id="tErrBody"></span>
      <div class="why" id="errWhy"></div>
      <button class="btn-gold" id="retryBtn"></button>
    </div>
    <div class="priceline">
      <span id="updated"></span>
      <button class="btn-ghost" id="refreshBtn"></button>
    </div>
    <button class="manual-link" id="manualToggle"></button>
    <div class="form-row manual-row" id="manualRow">
      <input id="fManual" type="number" inputmode="decimal" min="0" step="any">
      <button class="btn-gold" id="manualBtn"></button>
    </div>
  </section>

  <!-- SAVINGS -->
  <section class="card">
    <h2 id="tSavings"></h2>
    <p class="hint" id="tSavingsHint"></p>
    <div class="form-row add-form">
      <select id="fKarat">
        <option value="24" data-k="24"></option>
        <option value="21" data-k="21" selected></option>
        <option value="18" data-k="18"></option>
        <option value="22" data-k="22"></option>
        <option value="gineh" data-k="gineh"></option>
      </select>
      <input id="fGrams" type="number" inputmode="decimal" min="0" step="any">
      <input id="fBuy" type="number" inputmode="decimal" min="0" step="any">
      <input id="fWk" type="number" inputmode="decimal" min="0" step="any">
      <button class="btn-gold" id="addBtn"></button>
    </div>
    <div id="holdings"></div>
    <div class="totals" id="totalsBox" style="display:none">
      <div class="total total-hero"><div class="k" id="tTValue"></div><div class="v" id="tValue">—</div></div>
      <div class="total"><div class="k" id="tTPure"></div><div class="v" id="tPure">—</div></div>
      <div class="total" id="tPLBox"><div class="k" id="tTPL"></div><div class="v" id="tPL">—</div></div>
    </div>
    <div class="wknote" id="wkNote" style="display:none"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn-ghost" id="demoBtn"></button></div>
  </section>

  <!-- ZAKAT -->
  <section class="card">
    <h2 id="tZakat"></h2>
    <p class="hint" id="tZakatHint"></p>
    <div id="zakatBox"></div>
    <div class="form-row" id="hawlRow" style="display:none">
      <input id="fHawl" type="date" style="flex:2">
      <button class="btn-gold" id="hawlBtn"></button>
    </div>
    <p class="hint" style="margin-top:8px" id="tHawlNote"></p>
  </section>

  <footer id="tFooter"></footer>
</div>
<div class="toast" id="toast"></div>

const urlLang = new URLSearchParams(location.search).get('lang');
let lang = (urlLang === 'en' || urlLang === 'ar') ? urlLang : (localStorage.getItem('dehbak.lang') || 'ar');
let S = STR[lang];

let price = null;            // {gram24Egp, usdEgp, ozUsd, updatedAt, source, manual}
let prevGram24 = null;
let manualMode = false;
let holdings = JSON.parse(localStorage.getItem('dehbak.holdings') || '[]');
let hawlStart = localStorage.getItem('dehbak.hawl') || '';
const fmt = (n, d=0) => n.toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:d});
const karatFactor = k => k==='gineh' ? (8*21/24) : (+k)/24;
const karatName = k => k==='gineh' ? S.gineh : S.karat(k);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2200); }

}

/* ---------- price fetching ---------- */
function fetchJSON(url, timeoutMs){
  return new Promise((resolve, reject)=>{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>{ ctrl.abort(); reject(new Error('timeout')); }, timeoutMs || FETCH_TIMEOUT);
    fetch(url, {signal: ctrl.signal, cache: 'no-store'})
      .then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(j=>{ clearTimeout(timer); resolve(j); })
      .catch(e=>{ clearTimeout(timer); reject(e); });
  });
}
function fetchText(url, timeoutMs){
  return new Promise((resolve, reject)=>{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>{ ctrl.abort(); reject(new Error('timeout')); }, timeoutMs || FETCH_TIMEOUT);
    fetch(url, {signal: ctrl.signal, cache: 'no-store'})
      .then(r=>{ if(!r.ok) throw new Error('http '+r.status); return r.text(); })
      .then(j=>{ clearTimeout(timer); resolve(j); })
      .catch(e=>{ clearTimeout(timer); reject(e); });
  });
}
function parseSagha(html){
  let t = html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ');
  t = t.replace(/<[^>]+>/g,'|').replace(/\s+/g,' ').replace(/ *\| */g,'|').replace(/\|+/g,'|');
  const k = {};
  const tre = /(\d+)K\|عيار \1\|[▲▼]\|شراء\|([\d.]+)\|ج\.م\|بيع\|([\d.]+)\|ج\.م/g;
  let m; while((m = tre.exec(t))) k[m[1]] = { buy:+m[2], sell:+m[3] };
  const ti = t.indexOf('العيار|بيع');
  const tbl = ti >= 0 ? t.slice(ti) : t;
  const row = label => { const r = tbl.match(new RegExp(label + '\\|([\\d.]+)\\|ج\\.م\\|[\\d.]+\\|ج\\.م\\|([\\d.]+)\\|ج\\.م')); return r ? { sell:+r[1], buy:+r[2] } : null; };
  ['14','18','21','22','24'].forEach(x=>{ const v = row('عيار ' + x); if(v) k[x] = v; });
  const gineh = row('جنيه ذهب');
  const ozm = tbl.match(/أوقية الذهب\|([\d.]+)\|\$/);
  if(!k['24'] || !k['22'] || !k['21'] || !k['18'] || !gineh) throw new Error('parse failed');
  return { mode:'sagha', k, gineh, ozUsd: ozm ? +ozm[1] : null, source:'isagha' };
}
async function fetchSagha(){
  const html = await fetchText('https://market.isagha.com/prices?_=' + Date.now(), 10000);
  return parseSagha(html);
}
const SOURCES = [
  { name: 'iSagha', get: fetchSagha },
  { name: 'xaus.com', get: async ()=>{
      const j = await fetchJSON('https://xaus.com/api/v1/spot?currency=EGP&unit=gram');
      if(!j.xau || !j.xau.price) throw new Error('bad data');
      return { gram24Egp: j.xau.price, usdEgp: j.fx_rates && j.fx_rates.EGP, ozUsd: j.spot_usd_oz, source: 'xaus.com' };
  }},
  { name: 'gold-api.com', get: async ()=>{
      const [g, fx] = await Promise.all([
        fetchJSON('https://api.gold-api.com/price/XAU'),
        fetchJSON('https://open.er-api.com/v6/latest/USD'),
      ]);
      const egp = fx.rates && fx.rates.EGP;
      if(!g.price || !egp) throw new Error('bad data');
      return { gram24Egp: g.price/TROY*egp, usdEgp: egp, ozUsd: g.price, source: 'gold-api.com' };
  }},
  { name: 'gold-api + jsdelivr', get: async ()=>{
      const [g, fx] = await Promise.all([
        fetchJSON('https://api.gold-api.com/price/XAU'),
        fetchJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json'),
      ]);
      const egp = fx.usd && fx.usd.egp;
      if(!g.price || !egp) throw new Error('bad data');
      return { gram24Egp: g.price/TROY*egp, usdEgp: egp, ozUsd: g.price, source: 'gold-api.com' };
  }},
];

let badgeCls = 'live';
function badgeTxt(){ return badgeCls==='live' ? S.live : badgeCls==='stale' ? (price && price.manual ? S.manualB : S.savedB) : S.offlineB; }
function setBadge(cls, txt){ const b=$('liveBadge'); badgeCls=cls; b.className='badge '+cls; b.textContent=txt; }

function pushHistory(p){
  const hist = JSON.parse(localStorage.getItem('dehbak.hist') || '[]');
  const last = hist[hist.length-1];
  if(!last || Date.now()-last.t > 30000){
    hist.push({t: Date.now(), p: p});
    while(hist.length > 240) hist.shift();
    localStorage.setItem('dehbak.hist', JSON.stringify(hist));
  }
}

async function fetchPrice(){
  manualMode = false;
  $('errBox').style.display='none';
  if(!price){ $('updated').textContent = S.loading; $('updated').dataset.state='loading'; }
  const fails = [];
  for(const s of SOURCES){
    try{
      const p = await s.get();
      price = { mode: p.mode || 'intl', ...p, updatedAt: new Date(), manual: false };
      localStorage.setItem('dehbak.price', JSON.stringify(price));
      pushHistory(karatSell('21'));
      setBadge('live', S.live);
      $('updated').dataset.state='';
      renderAll();
      return;
    }catch(e){ fails.push(s.name); }
  }
  setBadge('err', S.offlineB);
  $('errWhy').textContent = S.errWhy(fails.join(', '));
  $('errBox').style.display='block';
  $('updated').textContent = price ? S.lastAvail : S.noPrice;
  $('updated').dataset.state='';
  renderHoldingsSafe();
}

function loadCached(){
  const c = localStorage.getItem('dehbak.price');
  if(c){ price = JSON.parse(c); price.updatedAt = new Date(price.updatedAt);
    setBadge('stale', badgeTxt());
    renderAll(); }
}

function karatSell(k){
  if(price.mode === 'sagha'){
    if(k === 'gineh') return price.gineh.sell;
    return price.k[k] ? price.k[k].sell : null;
  }
  return price.gram24Egp * (k==='gineh' ? (8*21/24) : (+k)/24);
}
function karatBuy(k){
  if(price.mode === 'sagha'){
    if(k === 'gineh') return price.gineh.buy;
    return price.k[k] ? price.k[k].buy : null;
  }
  return null;
}
function gramPrice(k){ return karatSell(k); }
function renderAll(){ renderPrices(); renderHoldings(); renderSpark(); }

function fmtTime(d){ return d.toLocaleTimeString(lang==='ar' ? 'ar-EG-u-nu-latn' : 'en-GB', {hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d){ return d.toLocaleDateString(lang==='ar' ? 'ar-EG-u-nu-latn' : 'en-GB', {day:'numeric',month:'long',year:'numeric'}); }
function fmtHijri(d){ return new Intl.DateTimeFormat((lang==='ar'?'ar-SA':'en')+'-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(d); }

function renderPrices(){
  if(!price) return;
  const s21 = karatSell('21'), b21 = karatBuy('21');
  $('g21').textContent = fmt(s21);
  $('heroBuy').innerHTML = b21 ? S.heroSell(fmt(b21)) : '';
  [['24','g24'],['22','g22'],['21','g21b'],['18','g18']].forEach(([k, id])=>{
    const sell = karatSell(k), buy = karatBuy(k);
    $(id).innerHTML = fmt(sell)+' <small>'+S.egp+'</small>' + (buy ? '<div class="buyline">'+S.youSell+' '+fmt(buy)+'</div>' : '');
  });
  const gs = karatSell('gineh'), gb = karatBuy('gineh');
  $('gineh').innerHTML = fmt(gs)+' <small>'+S.egp+'</small>' + (gb ? '<div class="buyline">'+S.youSell+' '+fmt(gb)+'</div>' : '');
  $('oz').innerHTML = price.ozUsd ? fmt(price.ozUsd)+' <small>$</small>' : '—';
  if(prevGram24 && !price.manual){
    const d = s21 - prevGram24, pct = d/prevGram24*100;
    const el = $('chg');
    if(Math.abs(pct) < 0.005) { el.style.display='none'; }
    else {
      el.style.display='inline-block';
      el.className = 'chg ' + (d>=0?'up':'down');
      el.textContent = (d>=0?'▲ ':'▼ ') + fmt(Math.abs(pct),2) + (lang==='ar'?'٪':'%');
    }
  }
  prevGram24 = s21;
  const srcLabel = price.mode === 'sagha' ? S.srcSagha : price.source;
  $('updated').textContent = price.manual
    ? S.manualLine(fmtTime(price.updatedAt))
    : S.updatedLine(fmtTime(price.updatedAt), srcLabel, price.usdEgp ? fmt(price.usdEgp,2) : null);
  $('updated').dataset.state='';
}

function renderSpark(){
  const wrap = $('sparkWrap'), svg = $('spark');
  const hist = JSON.parse(localStorage.getItem('dehbak.hist') || '[]');
  if(hist.length < 2){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  const pts = hist.slice(-60);
  const vals = pts.map(p=>p.p);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max-min) || 1;
  const W=300, H=52, PAD=4;
  const stepX = (W-2*PAD)/(pts.length-1);
  const coords = pts.map((p,i)=>[PAD+i*stepX, H-PAD-((p.p-min)/span)*(H-2*PAD)]);
  const line = coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const area = line + ` L${coords[coords.length-1][0].toFixed(1)},${H} L${coords[0][0].toFixed(1)},${H} Z`;
  const up = vals[vals.length-1] >= vals[0];
  const col = up ? '#1a9e5c' : '#d43a3a';
  svg.setAttribute('dir','ltr');
  svg.innerHTML = `<path d="${area}" fill="${col}" opacity="0.12"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
}

function renderHoldingsSafe(){
  const box = $('holdings');
  if(!holdings.length){ box.innerHTML = '<div class="empty">'+S.empty+'</div>'; }
  else { box.innerHTML = '<div class="empty">'+S.waiting(fmt(holdings.length))+'</div>'; }
}

function renderHoldings(){
  if(!price){ renderHoldingsSafe(); return; }
  const box = $('holdings'); box.innerHTML='';
  let totalVal=0, totalPure=0, totalCost=0, valWithCost=0, hasCost=false;
  holdings.forEach(h=>{
    const cur = h.grams * gramPrice(h.karat);
    const pure = h.grams * karatFactor(h.karat);
    totalVal += cur; totalPure += pure;
    let plHtml='', subHtml='', paidHtml='';
    const wk = h.wk || 0;
    if(h.buy || wk > 0){
      const cost = h.grams * ((h.buy || 0) + wk);
      totalCost += cost; valWithCost += cur; hasCost = true;
      const pl = cur-cost, p = pl/cost*100;
      plHtml = `<div class="pl ${pl>=0?'up':'down'}">${pl>=0?'+':'−'}${fmt(Math.abs(pl))} ${S.egp} (${fmt(Math.abs(p),1)}${lang==='ar'?'٪':'%'})</div>`;
      subHtml = h.buy && wk ? S.paidBreak(fmt(h.buy), fmt(wk)) : (h.buy ? S.boughtAt(fmt(h.buy)) : S.wkOnly(fmt(wk)));
      paidHtml = `<div class="s2">${S.paidTotal(fmt(cost))}</div>`;
    }
    const row = document.createElement('div'); row.className='holding';
    row.innerHTML = `<div class="info">
        <div class="t">${fmt(h.grams, h.grams%1?2:0)} ${h.karat==='gineh'?'':S.gramWord+' '}${karatName(h.karat)}</div>
        <div class="s">${subHtml}</div>${paidHtml}
      </div>
      <div class="val"><div class="n">${fmt(cur)} ${S.egp}</div>${plHtml}</div>
      <button class="del" data-id="${h.id}">🗑</button>`;
    box.appendChild(row);
  });
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ holdings = holdings.filter(x=>x.id!=b.dataset.id); save(); toast(S.tDeleted); });
  if(holdings.length){
    $('wkNote').style.display = holdings.some(h=>h.wk>0) ? 'block' : 'none';
    $('totalsBox').style.display='grid';
    $('tValue').textContent = fmt(totalVal)+' '+S.egp;
    $('tPure').textContent = fmt(totalPure,2)+' '+(lang==='ar'?'جم':'g');
    const plEl = $('tPL'), plBox = $('tPLBox');
    plBox.classList.remove('up','down');
    if(hasCost){ const pl = valWithCost-totalCost, pPct = pl/totalCost*100;
      plEl.textContent = (pl>=0?'+':'−')+fmt(Math.abs(pl))+' '+S.egp+' ('+fmt(Math.abs(pPct),1)+(lang==='ar'?'٪':'%')+')';
      plEl.style.color = '';
      plBox.classList.add(pl>=0?'up':'down');
    } else { plEl.textContent='—'; plEl.style.color='var(--ink2)'; }
  } else {
    $('wkNote').style.display='none';
    $('totalsBox').style.display='none';
    box.innerHTML = '<div class="empty">'+S.empty+'</div>';
  }
  renderZakat(totalPure, totalVal);
}

function renderZakat(pure, val){
  const box = $('zakatBox');
  if(!price){ box.innerHTML=''; return; }
  const nisabValue = 85 * karatSell('24');
  if(pure <= 0){
    box.innerHTML = `<div class="zakat-box no">${S.zNisabInfo(fmt(nisabValue), fmt(karatSell('24')))}</div>`;
    $('hawlRow').style.display='none'; return;
  }
  if(pure < 85){
    const pct = Math.min(100, pure/85*100);
    box.innerHTML = `<div class="zakat-box no">${S.zBelow(fmt(pure,2), fmt(nisabValue), fmt(85-pure,2))}
      <div class="prog"><i style="width:${pct}%"></i></div></div>`;
    $('hawlRow').style.display='none'; return;
  }
  $('hawlRow').style.display='flex';
  const z = val * 0.025;
  let hawlHtml;
  if(hawlStart){
    const start = new Date(hawlStart), due = new Date(start); due.setDate(due.getDate()+354);
    const days = Math.ceil((due - Date.now())/86400000);
    hawlHtml = days>0
      ? S.zFuture(fmtHijri(due), fmtDate(due), fmt(days))
      : S.zPast(fmtHijri(due), fmt(Math.abs(days)));
  } else {
    hawlHtml = S.zAboveNoDate;
  }
  box.innerHTML = `<div class="zakat-box ok">${hawlHtml}<div class="zakat-big">${fmt(z)} ${S.zEGP}</div>
    <span class="hint">${S.zNote(fmt(val), fmt(pure,2))}</span></div>`;
}

function save(){ localStorage.setItem('dehbak.holdings', JSON.stringify(holdings)); renderHoldings(); }

$('addBtn').onclick = ()=>{
  const karat = $('fKarat').value;
  const grams = parseFloat($('fGrams').value);
  const buy = parseFloat($('fBuy').value);
  const wk = parseFloat($('fWk').value);
  if(!grams || grams<=0){ toast(S.tEnterWeight); return; }
  holdings.push({id:Date.now(), karat, grams, buy: buy>0?buy:null, wk: wk>0?wk:null});
  $('fGrams').value=''; $('fBuy').value=''; $('fWk').value='';
  save(); toast(S.tSaved);
};
$('demoBtn').onclick = ()=>{
  holdings.push({id:Date.now(), karat:'21', grams:10, buy:5200, wk:300});
  holdings.push({id:Date.now()+1, karat:'gineh', grams:2, buy:null});
  save(); toast(S.tExample);
};
$('hawlBtn').onclick = ()=>{
  const d = $('fHawl').value;
  if(!d){ toast(S.tPickDate); return; }
  hawlStart = d; localStorage.setItem('dehbak.hawl', d); renderHoldings(); toast(S.tHawlDone);
};
$('refreshBtn').onclick = ()=>{ $('updated').textContent=S.refreshing; $('updated').dataset.state='loading'; fetchPrice(); };
$('retryBtn').onclick = ()=>{ $('errBox').style.display='none'; $('updated').textContent=S.refreshing; $('updated').dataset.state='loading'; fetchPrice(); };
$('manualToggle').onclick = ()=>{
  const row = $('manualRow');
  row.style.display = row.style.display==='flex' ? 'none' : 'flex';
};
$('manualBtn').onclick = ()=>{
  const g = parseFloat($('fManual').value);
  if(!g || g<=0){ toast(S.tEnterManual); return; }
  price = { gram24Egp: g, usdEgp: price && price.usdEgp, ozUsd: null, updatedAt: new Date(), source: 'manual', manual: true };
  manualMode = true;
  localStorage.setItem('dehbak.price', JSON.stringify(price));
  pushHistory(g);
  setBadge('stale', S.manualB);
  $('errBox').style.display='none';
  $('manualRow').style.display='none';
  $('fManual').value='';
  renderAll(); toast(S.tManualDone);
};

/* boot */
if(hawlStart) $('fHawl').value = hawlStart;
document.documentElement.lang = lang;
document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
document.documentElement.className = lang;
document.title = S.title;
applyLang();
$('updated').textContent = S.loading; $('updated').dataset.state='loading';
loadCached();
fetchPrice();
setInterval(()=>{ if(!manualMode) fetchPrice(); }, 60000);
</script>
